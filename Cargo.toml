[package]
name = "kittybrowser"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/graiz/kittybrowser"
readme = "README.md"
description = "A fast web browser that runs in a terminal pane, drawn with the kitty graphics protocol"

[[bin]]
name = "kb"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
