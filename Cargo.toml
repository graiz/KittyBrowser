[package]
name = "kittybrowser"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/graiz/kittybrowser"
readme = "README.md"
homepage = "https://github.com/graiz/kittybrowser"
keywords = ["browser", "terminal", "kitty", "chrome", "agents"]
categories = ["command-line-utilities", "web-programming"]
authors = ["Gregory Raiz"]
description = "A fast web browser that runs in a terminal pane, drawn with the kitty graphics protocol"

[[bin]]
name = "kb"
path = "src/main.rs"

[dependencies]
libc = "0.2"
png = "0.17"
serde_json = "1"
zune-jpeg = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
