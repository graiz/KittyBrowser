[package]
name = "kittybrowser"
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/graiz/kittybrowser"
readme = "README.md"
keywords = ["browser", "terminal", "kitty", "chrome", "agents"]
categories = ["command-line-utilities", "web-programming"]
authors = ["Gregory Raiz"]
description = "A fast web browser that runs in a terminal pane, drawn with the kitty graphics protocol"
# The demo and social images are for the README on GitHub; the crate needs
# only the logo it draws.
exclude = ["assets/demo.gif", "assets/social.png", ".github/"]

[[bin]]
name = "kb"
path = "src/main.rs"

[dependencies]
libc = "0.2"
miniz_oxide = "0.8"
png = "0.18"
serde_json = "1"
zune-jpeg = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_System_StationsAndDesktops"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
